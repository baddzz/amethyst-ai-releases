name: Announce release to Discord

# Fires whenever a release goes live on this repo (gh release create, or publishing a
# draft) - posts an embed to the updates channel so there's no separate step to remember
# after cutting a release. Requires a DISCORD_WEBHOOK_URL repo secret (Settings -> Secrets
# and variables -> Actions) pointing at the target channel's webhook.
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post release embed to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Deliberately generic and link-free - just "new build's live, here's the
          # version", never the actual release notes/changelog or a URL back to the repo.
          # Passed in via env (not interpolated directly into this script by GitHub's own
          # template expansion) specifically so a tag containing quotes/backticks/etc.
          # can't break out of the command - jq reads it safely as a plain string.
          PAYLOAD=$(jq -n \
            --arg desc "Version $RELEASE_TAG" \
            '{embeds: [{title: "New Build Update", description: $desc, color: 9647082, timestamp: (now | todate)}]}')
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD"
